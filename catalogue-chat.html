<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue Chat — Atelier Galaad</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/chat.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="nav nav-scrolled" id="main-nav" data-transparent="false">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="assets/images/logo.jpg" alt="Atelier Galaad" style="height: 40px; border-radius: 50%;">
                <span class="logo-text">Galaad</span>
            </a>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Accueil</a>
                <a href="catalogue-chat.html" class="nav-link active">Catalogue</a>
                <a href="#" class="nav-link">À Propos</a>
            </div>
            <div class="nav-actions">
                <button class="icon-button"><i data-lucide="shopping-bag"></i></button>
                <button class="icon-button"><i data-lucide="menu"></i></button>
            </div>
        </div>
    </nav>

    <header class="page-header section-padding">
        <div class="container text-center fade-in-up">
            <h1 class="heading-1">Notre Catalogue</h1>
            <p class="subtitle">Discutez avec notre conseillère virtuelle pour trouver la composition parfaite</p>
        </div>
    </header>

    <main class="container section-padding pt-0 fade-in-up">
        <div class="chat-layout">
            <!-- Sidebar -->
            <aside class="sidebar card">
                <div class="sidebar-section">
                    <h3 class="heading-3 mb-sm">Recherche</h3>
                    <div class="input-group">
                        <i data-lucide="search"></i>
                        <input type="text" placeholder="Rechercher une fleur..." id="sidebar-search">
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="heading-3 mb-sm">Occasions</h3>
                    <div class="chips-container" id="occasion-chips">
                        <!-- Rendered by JS -->
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3 class="heading-3 mb-sm">Fleurs Populaires</h3>
                    <ul class="popular-list" id="popular-flowers">
                        <li><i data-lucide="sparkles"></i> Pivoine Sarah Bernhardt</li>
                        <li><i data-lucide="sparkles"></i> Rose de Damas</li>
                        <li><i data-lucide="sparkles"></i> Hortensia Magique</li>
                    </ul>
                </div>
            </aside>

            <!-- Chat Window -->
            <section class="chat-window card">
                <div class="chat-header">
                    <div class="avatar-wrapper">
                        <div class="bot-avatar">🌸</div>
                        <span class="online-dot"></span>
                    </div>
                    <div>
                        <h3 class="heading-3 mb-0">Conseillère Galaad</h3>
                        <p class="text-small text-muted">En ligne</p>
                    </div>
                </div>

                <div class="chat-messages" id="chat-messages">
                    <!-- Messages go here -->
                </div>

                <div class="quick-chips" id="quick-chips">
                    <!-- Suggestions go here -->
                </div>

                <div class="chat-input-bar">
                    <button class="icon-button"><i data-lucide="paperclip"></i></button>
                    <input type="text" id="chat-input" placeholder="Écrivez votre message..." autocomplete="off">
                    <button class="btn btn-primary btn-icon" id="send-btn">
                        <i data-lucide="send"></i>
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script src="data/catalogue.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/chat.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
